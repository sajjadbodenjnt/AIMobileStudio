name: DroidForge Android CI

on:
  push:
    branches: [droidforge-ai]
    paths:
      - "DroidForgeAI/**"
      - ".github/workflows/droidforge-android.yml"
  pull_request:
    paths:
      - "DroidForgeAI/**"

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p DroidForgeAI :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DroidForgeAI-debug
          path: DroidForgeAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
