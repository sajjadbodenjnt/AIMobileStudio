plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sajjad.aimobilestudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sajjad.aimobilestudio'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0.1'
    }

    // Keep the debug build installable on Android 7.0+ devices.
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
